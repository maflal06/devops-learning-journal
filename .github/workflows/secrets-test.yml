name: Practice GitHub Secrets

on:
  push:
    branches: [ "feature/day-2-repeat" ]

jobs:
  test-secret:
    runs-on: ubuntu-latest
      steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Test secret output
        env:
          MY_SECRET: ${{ secrets.PRACTICE_SECRET }}
        run: |
          echo "Testing secret masking in logs..."
          echo "Secret value: $MY_SECRET"