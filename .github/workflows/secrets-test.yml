name: Test GitHub Secrets

on:
  push:
    branches: [ "feature/day-2-practice" ]

jobs:
  secret-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Demonstrate Secret Usage
        env:
          # We map the repository secret to an environment variable in the runner
          SECRET_VAL: ${{ secrets.MY_SUPER_SECRET_KEY }}
        run: |
          echo "Attempting to print the secret securely..."
          echo "My secret is: $SECRET_VAL"